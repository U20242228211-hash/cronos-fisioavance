# docker compose up -d   ·   luego: docker compose exec web python manage.py crear_institucion ...
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cronos
      POSTGRES_USER: cronos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambie-esta-clave}
    volumes: [datos:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://cronos:${POSTGRES_PASSWORD:-cambie-esta-clave}@db/cronos
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on: [db]
volumes:
  datos:
  media:
