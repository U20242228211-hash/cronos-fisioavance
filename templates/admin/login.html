{% extends "admin/login.html" %}

{% block login_before %}
  {% if demo %}
    <div style="border:1px solid #f0d58a;background:#fff8e1;color:#4a3a00;border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:14px;line-height:1.45">
      <div style="font-weight:700;margin-bottom:6px">Versión de demostración · datos ficticios</div>
      <div style="margin-bottom:8px">Clave para todos: <code style="background:#fff;border:1px solid #f0d58a;border-radius:6px;padding:2px 7px;font-size:14px;font-weight:700">{{ demo.clave }}</code></div>
      <div style="margin-bottom:4px">Toque un usuario para llenar los datos:</div>
      {% for usuario, rol in demo.usuarios %}
        <button type="button" class="demo-usuario" data-usuario="{{ usuario }}" style="display:block;width:100%;text-align:left;background:#fff;border:1px solid #f0d58a;border-radius:8px;padding:6px 10px;margin-top:6px;cursor:pointer;color:inherit;font-size:14px"><b>{{ usuario }}</b> · {{ rol }}</button>
      {% endfor %}
    </div>
    <script>
      document.querySelectorAll(".demo-usuario").forEach(function (b) {
        b.addEventListener("click", function () {
          document.getElementById("id_username").value = b.dataset.usuario;
          document.getElementById("id_password").value = "{{ demo.clave|escapejs }}";
        });
      });
    </script>
  {% endif %}
  {{ block.super }}
{% endblock %}
